# The Brain: re-runs the strategy search every 6 hours and commits its state. It searches a fixed
# data snapshot (brain/weekly.json); nothing here refreshes market data. A green run means the job
# worked, not that its champion is validated. Free on GitHub Actions for public repositories.
name: Brain
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brain
  cancel-in-progress: false
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the newest main, not the commit the schedule fired on: a queued duplicate run would
      # otherwise evolve a stale state and fail on push (run #49, 2026-10-20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Evolve 24 generations
        # skips (exit 0, no change) if another run wrote the state in the last 2 hours
        run: node brain/evolve.mjs --state brain/state.json --data brain/weekly.json --generations 24 --min-gap-hours 2
      - name: Commit the new state
        run: |
          git config user.name "brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain/state.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          gen=$(node -e "console.log(JSON.parse(require('fs').readFileSync('brain/state.json','utf8')).generation)")
          git commit -q -m "Brain: generation $gen"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep $((i * 5)); done
          exit 1
