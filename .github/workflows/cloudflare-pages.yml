# Mirrors this site to Cloudflare Pages (free): https://siddharthbagga.pages.dev
# Inactive until two repository secrets exist (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
name: Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: siddharthbagga
    steps:
      - name: Skip when Cloudflare isn't configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 20
      - name: Stage the static site
        if: steps.gate.outputs.go == 'true'
        run: rsync -a --exclude .git --exclude .github ./ _site/
      - name: Create the Pages project (first run only)
        if: steps.gate.outputs.go == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: npx --yes wrangler@3 pages deploy _site --project-name="$PROJECT" --branch=main --commit-dirty=true
